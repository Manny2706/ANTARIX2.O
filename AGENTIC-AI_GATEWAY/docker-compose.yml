services:
  satquery:
    build: .
    image: satquery-backend:latest
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_FALLBACK_MODELS: ${GROQ_FALLBACK_MODELS:-llama-3.3-70b-versatile,llama-3.1-8b-instant}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      VLM_BACKEND: ${VLM_BACKEND:-local}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-manny2706/satquery-qwen2vl-4bitQuantized}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_KEYS: ${API_KEYS:-}
    volumes:
      - ./var:/app/var
    restart: unless-stopped

    # --- Local GPU inference (VLM_BACKEND=local, the image default) -------
    # Requires the NVIDIA Container Toolkit installed on the host. If it
    # isn't available, comment this block back out (and set VLM_BACKEND back
    # to "disabled" or a non-quantized model) — without a GPU attached,
    # bitsandbytes 4-bit inference has no CPU fallback and errors on request.
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
