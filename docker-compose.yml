services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: antarix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-satquery}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-satquery}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - antarix-network

  # ============================================================================
  # 2. Agentic AI Gateway (SatQuery LangGraph + Vision Model + Groq/OpenRouter)
  # ============================================================================
  agentic-ai-gateway:
    build:
      context: ./AGENTIC-AI_GATEWAY
      dockerfile: Dockerfile
    image: antarix-agentic-ai-gateway:latest
    container_name: antarix_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_FALLBACK_MODELS: ${GROQ_FALLBACK_MODELS:-llama-3.3-70b-versatile,llama-3.1-8b-instant}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      VLM_BACKEND: ${VLM_BACKEND:-disabled}
      VLM_MODEL_ID: ${VLM_MODEL_ID:-manny2706/satquery-qwen2vl-4bitQuantized}
      VLM_LOAD_ON_STARTUP: ${VLM_LOAD_ON_STARTUP:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: "*"
      API_KEYS: ${API_KEYS:-}
    volumes:
      - gateway_data:/app/var
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1" ]
      interval: 10000s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - antarix-network
    # Optional GPU acceleration block (uncomment if NVIDIA Container Toolkit is installed)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # ============================================================================
    # 3. Backend Service (Node.js Express + TypeScript + Socket.IO + Prisma ORM)
    # ============================================================================
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    image: antarix-backend:latest
    container_name: antarix_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      agentic-ai-gateway:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-7000}:7000"
    environment:
      PORT: 7000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-satquery}?schema=public
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost"
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_antarix_satquery_ai_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      SOCKET_KEY: ${SOCKET_KEY:-bgvpit303269bgwb9nishant}
      ML_API_URL: http://agentic-ai-gateway:8000/api/v1/analyze/stream
      ML_API_KEY: ${API_KEYS:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:7000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - antarix-network

  # ============================================================================
  # 4. Frontend Service (React + Vite + Leaflet + Three.js + Nginx)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-7000}
        VITE_SOCKET_URL: http://localhost:${BACKEND_PORT:-7000}
        VITE_SOCKET_KEY: ${SOCKET_KEY:-bgvpit303269bgwb9nishant}
        VITE_USER_ID: ${DEFAULT_USER_ID:-70fa21d1-c6c0-4766-a264-9c2d418352c2}
    image: antarix-frontend:latest
    container_name: antarix_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://0.0.0.0:80/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - antarix-network

# ==============================================================================
# Shared Networks & Volumes
# ==============================================================================
networks:
  antarix-network:
    driver: bridge

volumes:
  postgres_data:
    name: antarix_postgres_data
  gateway_data:
    name: antarix_gateway_data
