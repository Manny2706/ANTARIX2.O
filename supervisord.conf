[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgres]
command=/bin/sh -c "PGV=$(ls /etc/postgresql) && exec /usr/lib/postgresql/$PGV/bin/postgres -D /var/lib/postgresql/$PGV/main -c config_file=/etc/postgresql/$PGV/main/postgresql.conf"
user=postgres
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agentic-ai-gateway]
command=/opt/venv/bin/python -m satquery
directory=/app/gateway
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",API_HOST="0.0.0.0",API_PORT="8000",VLM_BACKEND="disabled"

[program:backend]
command=sh -c "until pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1; do echo 'waiting for postgres...'; sleep 1; done; npx prisma db push --accept-data-loss --config prisma7.config.ts && if [ -f 'dist/index.js' ]; then node dist/index.js; else npx ts-node-dev --respawn --transpile-only src/index.ts; fi"
directory=/app/backend
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="7000",NODE_ENV="production",ML_API_URL="http://127.0.0.1:8000/api/v1/analyze/stream",SOCKET_KEY="bgvpit303269bgwb9nishant",DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/satquery?schema=public"

[program:frontend]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
