[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:agentic-ai-gateway]
command=python -m satquery
directory=/app/gateway
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",API_HOST="0.0.0.0",API_PORT="8000",VLM_BACKEND="disabled"

[program:backend]
command=sh -c "npx prisma db push --accept-data-loss --config prisma7.config.ts && if [ -f 'dist/index.js' ]; then node dist/index.js; else npx ts-node-dev --respawn --transpile-only src/index.ts; fi"
directory=/app/backend
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="7000",NODE_ENV="production",ML_API_URL="http://127.0.0.1:8000/api/v1/analyze/stream",SOCKET_KEY="bgvpit303269bgwb9nishant"

[program:frontend]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
